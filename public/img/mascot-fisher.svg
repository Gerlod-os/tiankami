<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Кроассан ловит случайную игру">
  <defs>
    <linearGradient id="gold" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FBE0A4"/>
      <stop offset=".35" stop-color="#F2BE62"/>
      <stop offset=".75" stop-color="#E39B3B"/>
      <stop offset="1" stop-color="#C77E2A"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".25" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8D7FF"/>
      <stop offset="1" stop-color="#7FB2F2"/>
    </linearGradient>
  </defs>

  <!-- удочка -->
  <path d="M250 268 Q346 168 436 152" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" paint-order="stroke"/>
  <path d="M250 268 Q346 168 436 152" fill="none" stroke="#A9713B" stroke-width="14" stroke-linecap="round"/>
  <circle cx="250" cy="268" r="14" fill="#8A5A2E" stroke="#FFFFFF" stroke-width="10" paint-order="stroke"/>
  <!-- леска + рыба -->
  <path d="M436 152 Q444 300 424 392" fill="none" stroke="#EDEAF6" stroke-width="4"/>
  <g transform="translate(424 414)">
    <ellipse rx="34" ry="22" fill="#FF9EB2" stroke="#FFFFFF" stroke-width="12" paint-order="stroke"/>
    <path d="M-30 0 L-56 -18 L-56 18 Z" fill="#FF8FA3" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" paint-order="stroke"/>
    <circle cx="14" cy="-5" r="5" fill="#5B3A1E"/>
    <path d="M6 -14 q10 14 0 26" fill="none" stroke="#E36A8C" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- брызги -->
  <g fill="#B8D7FF">
    <circle cx="384" cy="382" r="8"/>
    <circle cx="462" cy="376" r="6"/>
    <circle cx="446" cy="356" r="5"/>
  </g>
  <!-- вода -->
  <g fill="none" stroke-linecap="round">
    <path d="M180 470 Q300 448 424 470 Q470 480 500 470" stroke="url(#water)" stroke-width="16"/>
    <path d="M130 496 Q260 478 380 496" stroke="#7FB2F2" stroke-width="12" opacity=".7"/>
  </g>

  <!-- островок -->
  <ellipse cx="180" cy="382" rx="124" ry="30" fill="#7E9B6A" stroke="#FFFFFF" stroke-width="14" paint-order="stroke"/>
  <ellipse cx="180" cy="376" rx="100" ry="20" fill="#93B07D"/>
  <g stroke="#5F7C4E" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M96 366 q-6 -20 4 -34"/>
    <path d="M110 368 q2 -22 14 -30"/>
    <path d="M262 366 q8 -18 0 -32"/>
  </g>

  <!-- кроассан-рыбак -->
  <g transform="translate(52 118) scale(0.5)">
    <path
      d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
      fill="url(#gold)" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round" paint-order="stroke"/>
    <g stroke="#B9741F" stroke-opacity=".5" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M158 150 C166 185 164 225 152 262"/>
      <path d="M210 120 C216 155 214 195 206 232"/>
      <path d="M302 120 C296 155 298 195 306 232"/>
      <path d="M354 150 C346 185 348 225 360 262"/>
    </g>
    <path
      d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
      fill="url(#sheen)"/>
    <ellipse cx="196" cy="216" rx="16" ry="10" fill="#FF8FA3" opacity=".55"/>
    <ellipse cx="316" cy="216" rx="16" ry="10" fill="#FF8FA3" opacity=".55"/>
    <circle cx="228" cy="190" r="16" fill="#5B3A1E"/>
    <circle cx="284" cy="190" r="16" fill="#5B3A1E"/>
    <circle cx="233" cy="184" r="5" fill="#fff"/>
    <circle cx="289" cy="184" r="5" fill="#fff"/>
    <path d="M240 214 Q256 234 272 214" fill="none" stroke="#5B3A1E" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- рука с удочкой -->
  <path d="M216 302 Q238 286 252 270" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" paint-order="stroke"/>
  <path d="M216 302 Q238 286 252 270" fill="none" stroke="#E39B3B" stroke-width="28" stroke-linecap="round"/>
</svg>
