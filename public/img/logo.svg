<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tiankami — кроассан-геймпад">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7A8C8"/>
      <stop offset=".55" stop-color="#D98BC8"/>
      <stop offset="1" stop-color="#9B6BD8"/>
    </linearGradient>
    <linearGradient id="gold" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FBE0A4"/>
      <stop offset=".35" stop-color="#F2BE62"/>
      <stop offset=".75" stop-color="#E39B3B"/>
      <stop offset="1" stop-color="#C77E2A"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".25" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- фон-бейдж -->
  <rect width="512" height="512" rx="96" fill="url(#lbg)"/>
  <g stroke="#fff" stroke-opacity=".12" fill="none" stroke-width="10">
    <path d="M-40 130 Q160 60 552 150"/>
    <path d="M-40 215 Q180 155 552 235"/>
    <path d="M-40 420 Q200 480 560 400"/>
  </g>

  <!-- спусковые курки сзади -->
  <g fill="#3E338F">
    <rect x="176" y="84" width="64" height="26" rx="13" transform="rotate(-8 208 97)"/>
    <rect x="272" y="84" width="64" height="26" rx="13" transform="rotate(8 304 97)"/>
  </g>

  <!-- кроассан-геймпад -->
  <g>
    <path
      d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
      fill="url(#gold)" stroke="#FFF6E6" stroke-width="16" stroke-linejoin="round" paint-order="stroke"/>
    <!-- слои теста -->
    <g stroke="#B9741F" stroke-opacity=".5" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M158 150 C166 185 164 225 152 262"/>
      <path d="M210 120 C216 155 214 195 206 232"/>
      <path d="M302 120 C296 155 298 195 306 232"/>
      <path d="M354 150 C346 185 348 225 360 262"/>
    </g>
    <path
      d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
      fill="url(#sheen)"/>
    <!-- крестовина -->
    <path d="M150 202 h20 v20 h20 v20 h-20 v20 h-20 v-20 h-20 v-20 h20 z"
      fill="#463AA0" stroke="#2E2670" stroke-width="4" stroke-linejoin="round"/>
    <!-- кнопки действий -->
    <g fill="#463AA0" stroke="#2E2670" stroke-width="4">
      <circle cx="355" cy="200" r="12"/>
      <circle cx="385" cy="230" r="12"/>
      <circle cx="325" cy="230" r="12"/>
      <circle cx="355" cy="260" r="12"/>
    </g>
    <!-- стики -->
    <g>
      <circle cx="222" cy="218" r="25" fill="#2E2670"/>
      <circle cx="222" cy="214" r="17" fill="#7E70E0"/>
      <circle cx="290" cy="218" r="25" fill="#2E2670"/>
      <circle cx="290" cy="214" r="17" fill="#7E70E0"/>
    </g>
  </g>
</svg>
