<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Кроассан открывает коробку с мини-подборками">
  <defs>
    <linearGradient id="gold" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FBE0A4"/>
      <stop offset=".35" stop-color="#F2BE62"/>
      <stop offset=".75" stop-color="#E39B3B"/>
      <stop offset="1" stop-color="#C77E2A"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".25" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDA0F0"/>
      <stop offset="1" stop-color="#9B6BD8"/>
    </linearGradient>
  </defs>

  <!-- мини-кроассаны вылетают -->
  <g stroke-linejoin="round">
    <g transform="translate(118 208) scale(0.17) rotate(-18 256 240)">
      <path d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
        fill="url(#gold)" stroke="#FFFFFF" stroke-width="70" paint-order="stroke"/>
    </g>
    <circle cx="145" cy="242" r="6" fill="#5B3A1E"/>
    <circle cx="167" cy="238" r="6" fill="#5B3A1E"/>

    <g transform="translate(196 138) scale(0.17) rotate(8 256 240)">
      <path d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
        fill="url(#gold)" stroke="#FFFFFF" stroke-width="70" paint-order="stroke"/>
    </g>
    <circle cx="224" cy="172" r="6" fill="#5B3A1E"/>
    <circle cx="246" cy="170" r="6" fill="#5B3A1E"/>

    <g transform="translate(258 214) scale(0.17) rotate(22 256 240)">
      <path d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
        fill="url(#gold)" stroke="#FFFFFF" stroke-width="70" paint-order="stroke"/>
    </g>
    <circle cx="286" cy="248" r="6" fill="#5B3A1E"/>
    <circle cx="308" cy="246" r="6" fill="#5B3A1E"/>
  </g>

  <!-- коробка -->
  <g stroke-linejoin="round">
    <!-- крышка, откинута назад -->
    <g transform="rotate(-14 240 322)">
      <rect x="116" y="296" width="248" height="44" rx="14" fill="#CDA0F0" stroke="#FFFFFF" stroke-width="16" paint-order="stroke"/>
      <rect x="222" y="296" width="36" height="44" fill="#FFA8BC"/>
    </g>
    <!-- тело коробки -->
    <path d="M124 336 L372 336 L350 480 L146 480 Z" fill="url(#boxg)" stroke="#FFFFFF" stroke-width="18" paint-order="stroke"/>
    <!-- внутренность -->
    <path d="M124 336 Q248 312 372 336 Q248 366 124 336 Z" fill="#6E44B8"/>
    <!-- лента -->
    <path d="M234 340 L226 480 L270 480 L262 340 Z" fill="#FFA8BC"/>
    <path d="M234 340 L226 480 L270 480 L262 340 Z" fill="none" stroke="#FFFFFF" stroke-width="8" opacity=".7"/>
    <!-- бант на углу коробки -->
    <g transform="translate(248 344)">
      <path d="M0 0 C-26 -30 -58 -26 -52 -4 C-48 12 -18 10 0 0 Z" fill="#FFA8BC" stroke="#FFFFFF" stroke-width="12" paint-order="stroke"/>
      <path d="M0 0 C26 -30 58 -26 52 -4 C48 12 18 10 0 0 Z" fill="#FFA8BC" stroke="#FFFFFF" stroke-width="12" paint-order="stroke"/>
      <circle r="10" fill="#FF8FA3" stroke="#FFFFFF" stroke-width="10" paint-order="stroke"/>
    </g>
  </g>

  <!-- большой кроассан-персонаж справа -->
  <g transform="translate(268 66) scale(0.55)">
    <path
      d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
      fill="url(#gold)" stroke="#FFFFFF" stroke-width="30" stroke-linejoin="round" paint-order="stroke"/>
    <g stroke="#B9741F" stroke-opacity=".5" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M158 150 C166 185 164 225 152 262"/>
      <path d="M210 120 C216 155 214 195 206 232"/>
      <path d="M302 120 C296 155 298 195 306 232"/>
      <path d="M354 150 C346 185 348 225 360 262"/>
    </g>
    <path
      d="M84 318 C84 168 162 104 256 104 C350 104 428 168 428 318 C428 352 404 370 386 350 C350 272 314 240 256 240 C198 240 162 272 126 350 C108 370 84 352 84 318 Z"
      fill="url(#sheen)"/>
    <ellipse cx="196" cy="216" rx="16" ry="10" fill="#FF8FA3" opacity=".55"/>
    <ellipse cx="316" cy="216" rx="16" ry="10" fill="#FF8FA3" opacity=".55"/>
    <circle cx="228" cy="190" r="16" fill="#5B3A1E"/>
    <circle cx="284" cy="190" r="16" fill="#5B3A1E"/>
    <circle cx="233" cy="184" r="5" fill="#fff"/>
    <circle cx="289" cy="184" r="5" fill="#fff"/>
    <path d="M240 214 Q256 234 272 214" fill="none" stroke="#5B3A1E" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
